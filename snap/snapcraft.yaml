name: fs-user-stories
title: FS User Stories
version: '1.0.8'
summary: Write clear user stories and acceptance criteria, locally
description: |
  FS User Stories helps product owners, developers and small teams turn product
  requirements into clear, structured user stories without the complexity of a
  full project-management system.

  Organize stories by project and user profile, write the goal and benefit,
  define acceptance criteria, add notes and attachments, and track each story
  as a draft, active or completed item. Search and filter the workspace when you
  need to find a requirement quickly.

  Your workspace stays on your computer and works offline. No FS User Stories
  account, subscription or mandatory cloud service is required. Teams can
  optionally share and synchronize a project through a private Git repository.
  The app also exposes a local MCP endpoint so compatible coding agents can work
  with the same stories and acceptance criteria.
website: https://github.com/gitlares/fs-user-stories
issues: https://github.com/gitlares/fs-user-stories/issues
source-code: https://github.com/gitlares/fs-user-stories
contact:
  - https://github.com/gitlares/fs-user-stories
donation: https://www.paypal.com/donate/?hosted_button_id=7RDCBR3QXXEMJ
license: MIT
