name: fs-user-stories
title: FS User Stories
version: '1.0.7'
summary: Plan, share and sync user stories with Git
description: |
  FS User Stories is a focused desktop workspace for product teams. Create
  stories, acceptance criteria, profiles and attachments in one local project,
  then share the project through Git without a hosted database or account.

  The Linux application uses the same Rust core as the macOS application and
  the Qt/QML interface is designed to remain fast and usable offline. Changes
  are synchronized through the configured Git remote and conflicts are reported
  instead of silently overwriting work.

  This snap is the x86_64 Linux build of FS User Stories 1.0.7.
website: https://github.com/gitlares/fs-user-stories
issues: https://github.com/gitlares/fs-user-stories/issues
source-code: https://github.com/gitlares/fs-user-stories
contact:
  - https://github.com/gitlares/fs-user-stories
donation: https://www.paypal.com/donate/?hosted_button_id=7RDCBR3QXXEMJ
license: MIT
grade: stable
confinement: strict
base: core24
build-base: core24
icon: snap/gui/fs-user-stories.png
platforms:
