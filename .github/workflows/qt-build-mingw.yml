name: Build Windows on Linux (MinGW)

on:
  push:
    branches: [qt]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  QT_VERSION: 6.7.3

jobs:
  build-windows-mingw:
    name: Linux to Windows x64 (MinGW)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux cross-build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build mingw-w64 wine wine64 wine32:i386 xvfb zip p7zip-full

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install aqtinstall
        run: python -m pip install --quiet --upgrade aqtinstall

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cross-build, deploy and smoke-test
        run: ./Scripts/build-windows-on-linux.sh

      - name: Upload tested MinGW bundle
        uses: actions/upload-artifact@v4
        with:
          name: fs-user-stories-windows-mingw
          path: Distribution/Windows-MinGW/*.zip
          if-no-files-found: error
          retention-days: 14
