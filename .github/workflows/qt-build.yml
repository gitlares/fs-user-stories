name: Build Windows (Qt)

on:
  push:
    branches: [qt]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-windows:
    name: Windows (zip)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt 6.7.3 (aqtinstall)
        shell: bash
        run: |
          python -m pip install --quiet --upgrade aqtinstall
          aqt install-qt windows desktop 6.7.3 win64_msvc2019_64 \
            -O "$GITHUB_WORKSPACE/qt" -m qtquickcontrols2,qtsvg
          echo "Qt6_DIR=$GITHUB_WORKSPACE/qt/6.7.3/win64_msvc2019_64" >> "$GITHUB_ENV"

      - name: Install Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Add MSVC + Windows SDK to PATH
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: "Core -> target"
          shared-cache-key: windows-cargo-${{ hashFiles('Core/Cargo.lock') }}

      - name: Build Rust core
        shell: bash
        run: |
          cd Core
          cargo build --release --locked --target x86_64-pc-windows-msvc
          mkdir -p ../Platform/Qt/core-bundle
          cp target/x86_64-pc-windows-msvc/release/fs-user-stories-core.exe ../Platform/Qt/core-bundle/

      - name: Configure + build Qt
        shell: pwsh
        run: |
          cmake -S Platform/Qt -B Platform/Qt/build -G Ninja -DCMAKE_BUILD_TYPE=Release `
                -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"
          cmake --build Platform/Qt/build --parallel

      - name: Bundle + zip
        shell: pwsh
        run: ./Scripts/build-windows-app.ps1

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: fs-user-stories-windows
          path: Distribution/**/*.zip
          if-no-files-found: error
          retention-days: 14
