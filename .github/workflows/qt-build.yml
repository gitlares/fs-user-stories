name: Qt build (Linux / Windows / macOS)

on:
  push:
    branches: [qt, main]
  pull_request:
    branches: [qt, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux (AppImage)
            qt_host: linux
            qt_target: desktop
            qt_arch: gcc_64
            qt_modules: "qt5compat qml qtquick qtquickcontrols2 qtsvg"
            rust_target: x86_64-unknown-linux-gnu
            build_cmd: Scripts/build-linux-app.sh
            artifact_glob: "Distribution/**/*.AppImage"
          - os: windows-2022
            label: Windows (zip)
            qt_host: windows
            qt_target: desktop
            qt_arch: win64_msvc2019_64
            qt_modules: "qt5compat qml qtquick qtquickcontrols2 qtsvg"
            rust_target: x86_64-pc-windows-msvc
            build_cmd: Scripts/build-windows-app.ps1
            artifact_glob: "Distribution/**/*.zip"
          - os: macos-14
            label: macOS (zip)
            qt_host: mac
            qt_target: desktop
            qt_arch: clang_64
            qt_modules: "qt5compat qml qtquick qtquickcontrols2 qtsvg"
            rust_target: x86_64-apple-darwin
            build_cmd: Scripts/build-macos-app.sh
            artifact_glob: "Distribution/**/*.zip"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python + aqtinstall
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt 6.7.3 (aqtinstall)
        shell: bash
        run: |
          python -m pip install --quiet --upgrade aqtinstall
          aqt install-qt ${{ matrix.qt_host }} ${{ matrix.qt_target }} 6.7.3 ${{ matrix.qt_arch }} \
            -O ./qt -m ${{ matrix.qt_modules }}
          echo "Qt6_DIR=$(pwd)/qt/6.7.3/${{ matrix.qt_arch }}" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: "Core -> target"
          shared-cache-key: ${{ matrix.os }}-cargo-${{ matrix.rust_target }}-${{ hashFiles('Core/Cargo.lock') }}

      - name: Build Rust core
        shell: bash
        run: |
          cd Core
          cargo build --release --locked --target ${{ matrix.rust_target }}
          mkdir -p ../Platform/Qt/core-bundle
          for f in target/${{ matrix.rust_target }}/release/fs-user-stories-core*; do
            [ -e "$f" ] || continue
            cp "$f" ../Platform/Qt/core-bundle/
          done
          ls -la ../Platform/Qt/core-bundle/

      - name: Configure + build Qt
        shell: bash
        run: |
          echo "Using Qt at $Qt6_DIR"
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            powershell -NoProfile -Command "cmake -S Platform/Qt -B Platform/Qt/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=\"$env:Qt6_DIR\"; cmake --build Platform/Qt/build --parallel"
          else
            cmake -S Platform/Qt -B Platform/Qt/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_PREFIX_PATH="$Qt6_DIR"
            cmake --build Platform/Qt/build --parallel
          fi

      - name: Run platform deployer
        shell: bash
        run: ${{ matrix.build_cmd }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: fs-user-stories-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: warn
          retention-days: 14
