name: Build Windows (Qt)

on:
  push:
    branches: [qt]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-windows:
    name: Windows (zip)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt 6.7.3 (aqtinstall)
        shell: bash
        run: |
          python -m pip install --quiet --upgrade aqtinstall
          # aqtinstall with arch=win64_msvc2019_64 drops the bits into
          # `6.7.3/msvc2019_64/`, NOT `win64_msvc2019_64/` (that surprises everyone).
          # Qt 6.7 base install already includes Qml, Quick, QuickControls2,
          # Widgets, Svg, etc., so no -m modules needed.
          aqt install-qt windows desktop 6.7.3 win64_msvc2019_64 \
            -O "$GITHUB_WORKSPACE/qt"
          echo "Qt6_DIR=$GITHUB_WORKSPACE/qt/6.7.3/msvc2019_64" >> "$GITHUB_ENV"

      - name: Install Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Locate Visual Studio
        id: vs
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat",
            "C:\Program Files\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat",
            "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat"
          )
          foreach ($p in $candidates) { if (Test-Path $p) { Write-Host "::set-output name=vcvars::$p"; exit 0 } }
          Write-Error "vcvars64.bat not found"
          exit 1

      - name: Build Rust core (MSVC env)
        shell: cmd
        run: |
          call "${{ steps.vs.outputs.vcvars }}"
          cd /d "%GITHUB_WORKSPACE%\Core"
          cargo build --release --locked --target x86_64-pc-windows-msvc
          if errorlevel 1 exit /b 1
          if not exist "..\Platform\Qt\core-bundle" mkdir "..\Platform\Qt\core-bundle"
          copy /Y "target\x86_64-pc-windows-msvc\release\fs-user-stories-core.exe" "..\Platform\Qt\core-bundle\"
          dir "..\Platform\Qt\core-bundle"

      - name: Configure + build Qt
        shell: cmd
        run: |
          call "${{ steps.vs.outputs.vcvars }}"
          cmake -S Platform\Qt -B Platform\Qt\build -G Ninja -DCMAKE_BUILD_TYPE=Release ^
                -DCMAKE_PREFIX_PATH="%Qt6_DIR%"
          if errorlevel 1 exit /b 1
          cmake --build Platform\Qt\build --parallel
          if errorlevel 1 exit /b 1

      - name: Bundle + installer
        shell: pwsh
        run: ./Scripts/build-windows-app.ps1

      - name: Install and smoke-test packaged application
        shell: pwsh
        run: |
          $installer = Join-Path $env:GITHUB_WORKSPACE "Distribution/Windows/FSUserStoriesSetup-1.0.3-x64.exe"
          $install = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Windows installer failed with exit code $($install.ExitCode)"
          }
          $exe = Join-Path $env:LOCALAPPDATA "Programs/FS User Stories/fs-user-stories.exe"
          if (-not (Test-Path $exe)) {
            throw "Installed executable was not found: $exe"
          }
          $diagnostics = Join-Path $env:RUNNER_TEMP "fs-user-stories-smoke.log"
          $env:FS_USER_STORIES_DIAGNOSTICS = $diagnostics
          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $exe
          $startInfo.ArgumentList.Add("--smoke-test")
          $startInfo.UseShellExecute = $false
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true
          $process = [System.Diagnostics.Process]::Start($startInfo)
          $stdout = $process.StandardOutput.ReadToEnd()
          $stderr = $process.StandardError.ReadToEnd()
          $process.WaitForExit()
          if ($stdout) { Write-Host $stdout }
          if ($stderr) { Write-Host $stderr }
          if (Test-Path $diagnostics) {
            Write-Host "--- FS User Stories diagnostics ---"
            Get-Content $diagnostics
          }
          if ($process.ExitCode -ne 0) {
            throw "Installed Windows application failed with exit code $($process.ExitCode)"
          }

      - name: Upload tested x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: fs-user-stories-windows-x64-installer
          path: Distribution/Windows/FSUserStoriesSetup-1.0.3-x64.exe
          if-no-files-found: error
          retention-days: 14
